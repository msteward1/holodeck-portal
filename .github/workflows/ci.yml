name: Tests and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Server tests
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Container image builds
        run: docker build --build-arg HP_VERSION=ci -t holodeck-portal:ci .
