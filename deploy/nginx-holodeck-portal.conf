# Holodeck Portal — installed to /etc/nginx/conf.d/holodeck-portal.conf by deploy/install.sh
# __HOSTNAME__ is substituted at install time.

# Local sign-in: at most 10 attempts a minute per client address, bursts of 20 (the portal has its own,
# finer limits too; this one stops floods before they reach it).
limit_req_zone $binary_remote_addr zone=hp_login:1m rate=10r/m;
# SAML sign-in starts: each one stores a request ID for ten minutes; 30 a minute per address is plenty for people.
limit_req_zone $binary_remote_addr zone=hp_saml:1m rate=30r/m;

server {
    listen 80;
    server_name __HOSTNAME__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name __HOSTNAME__;

    ssl_certificate     /etc/holodeck-portal/ssl/portal.crt;
    ssl_certificate_key /etc/holodeck-portal/ssl/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;

    location = /api/auth/login {
        limit_req        zone=hp_login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout                 120;
    }

    # The webtop gateway's authorization answer carries the webtop login: only nginx's internal sub-request may ask.
    location = /api/webtop/authorize {
        return 404;
    }

    location = /api/auth/saml/login {
        limit_req        zone=hp_saml burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout                 120;
    }

    # Offline update bundles (About → Updates): large, streamed straight to the portal.
    location = /api/admin/updates/upload {
        client_max_body_size    5g;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout                 900;
        proxy_send_timeout                 900;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout                 120;
    }
}

# --- Webtop gateway (optional; off until enabled in Settings -> Holorouters) -------------------------------
# One HTTPS port per network slot (8440 + slot), so every Holorouter's webtop is its own browser origin.
# nginx asks the portal on each request whether the signed-in user may use that router, then adds the
# webtop's login itself; the portal's session cookie is never passed on to the router.
map $http_upgrade $hp_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8441 ssl;
    listen 8442 ssl;
    listen 8443 ssl;
    listen 8444 ssl;
    listen 8445 ssl;
    listen 8446 ssl;
    listen 8447 ssl;
    listen 8448 ssl;
    listen 8449 ssl;
    listen 8450 ssl;
    listen 8451 ssl;
    listen 8452 ssl;
    listen 8453 ssl;
    listen 8454 ssl;
    listen 8455 ssl;
    listen 8456 ssl;
    listen 8457 ssl;
    listen 8458 ssl;
    listen 8459 ssl;
    listen 8460 ssl;
    listen 8461 ssl;
    listen 8462 ssl;
    listen 8463 ssl;
    listen 8464 ssl;
    listen 8465 ssl;
    listen 8466 ssl;
    listen 8467 ssl;
    listen 8468 ssl;
    listen 8469 ssl;
    listen 8470 ssl;
    listen 8471 ssl;
    listen 8472 ssl;
    server_name __HOSTNAME__;

    ssl_certificate     /etc/holodeck-portal/ssl/portal.crt;
    ssl_certificate_key /etc/holodeck-portal/ssl/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /_hp_webtop_auth {
        internal;
        proxy_pass http://127.0.0.1:3080/api/webtop/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-HP-Gateway-Port $server_port;
        include /etc/holodeck-portal/nginx-gateway-token.conf;
    }

    location / {
        auth_request /_hp_webtop_auth;
        auth_request_set $hp_webtop_port $upstream_http_x_webtop_upstream_port;
        auth_request_set $hp_webtop_auth $upstream_http_x_webtop_authorization;
        error_page 401 = @hp_signin;

        proxy_pass http://127.0.0.1:$hp_webtop_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade       $http_upgrade;
        proxy_set_header Connection    $hp_connection_upgrade;
        proxy_set_header Authorization $hp_webtop_auth;
        proxy_set_header Cookie        "";
        proxy_set_header Host          $host;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location @hp_signin {
        return 302 https://$host/;
    }
}
